[package]
name = "emergency-delivery"
version = "1.1.8"
description = "Emergency Delivery — secure, scheduled document delivery with dead man's switch"
authors = ["Emergency Delivery Team"]
edition = "2021"
rust-version = "1.77"
license = "Proprietary"
repository = "https://github.com/ghostwipe-png/Emergency-Delivery"

[lib]
name = "emergency_delivery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# =============================================================================
# BUILD DEPENDENCIES
# =============================================================================

[build-dependencies]
tauri-build = { version = "2", features = [] }

# =============================================================================
# RUNTIME DEPENDENCIES (single-line inline tables only — strict TOML safe)
# =============================================================================

[dependencies]
# --- Tauri Core & Plugins (v2 stable) ---
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
bytes = "1"
futures = "0.3"
unicode-normalization = "0.1"

# --- Security & Cryptography (Military-Grade) ---
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Utilities & Observability ---
percent-encoding = "2.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
dotenv = "0.15"
once_cell = "1.19"
regex = "1.10"

# --- UI & System Integration ---
rfd = "0.14"
url = "2.5"
keyring = "=3.6.3"
tokio-tungstenite = "0.21"
futures-util = "0.3"
dirs = "5"
ansi_term = "0.12"
ctrlc = "3.4"
fs2 = "0.4"

# =============================================================================
# MULTI-FEATURE DEPENDENCIES (table form — strict TOML safe)
# =============================================================================

[dependencies.sqlx]
version = "0.7"
features = ["runtime-tokio-native-tls", "sqlite", "chrono", "migrate"]

[dependencies.reqwest]
version = "0.11"
default-features = false
features = ["json", "rustls-tls-native-roots", "cookies"]

[dependencies.tokio]
version = "1"
features = ["rt", "rt-multi-thread", "time", "macros", "sync", "signal"]

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# =============================================================================
# FEATURES
# =============================================================================

[features]
default = ["custom-protocol", "single-instance"]
custom-protocol = ["tauri/custom-protocol"]
single-instance = []

# =============================================================================
# PROFILES
# =============================================================================

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true
debug = false

[profile.dev]
opt-level = 0
debug = true
strip = false

[profile.test]
opt-level = 1
debug = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false