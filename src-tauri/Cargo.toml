[package]
name = "emergency-delivery"
version = "1.1.6"
description = "Emergency Delivery — secure, scheduled document delivery"
authors = ["Emergency Delivery"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "emergency_delivery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core + plugins (v2) ---
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"

# --- Security & crypto ---
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.11"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] } # UPGRADED: Added derive for auto-wiping structs
base64 = "0.22"
hex = "0.4"

# --- Database ---
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- HTTP client (HTTPS-only, rustls with OS native roots for corporate proxies) ---
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-native-roots"] } # UPGRADED: Native roots
percent-encoding = "2.3"

# --- Async runtime ---
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }

# --- Utilities & Observability ---
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2" # UPGRADED: Added for log rotation (prevents disk exhaustion)
dotenv = "0.15"
rfd = "0.14"
tauri-plugin-notification = "2.0.0-rc.5"
keyring = "3.6.3"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.33"
url = "2.5.8"
tauri-plugin-updater = "2.0.0-rc.4"
tauri-plugin-process = "2.0.0-rc.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
