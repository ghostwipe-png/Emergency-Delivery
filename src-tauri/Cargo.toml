[package]
name = "emergency-delivery"
version = "1.1.8"
description = "Emergency Delivery — secure, scheduled document delivery with dead man's switch"
authors = ["Emergency Delivery Team"]
edition = "2021"
rust-version = "1.77"
license = "Proprietary"
repository = "https://github.com/ghostwipe-png/Emergency-Delivery"

[lib]
name = "emergency_delivery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# =============================================================================
# BUILD DEPENDENCIES
# =============================================================================

[build-dependencies]
tauri-build = { version = "2", features = [] }

# =============================================================================
# RUNTIME DEPENDENCIES
# =============================================================================

[dependencies]
# -----------------------------------------------------------------------------
# Tauri Core & Plugins (v2 stable)
# -----------------------------------------------------------------------------
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
bytes = "1"
futures = "0.3"
unicode-normalization = "0.1"

# -----------------------------------------------------------------------------
# Security & Cryptography (Military-Grade)
# -----------------------------------------------------------------------------
aes-gcm = "0.10"                       # AES-256-GCM authenticated encryption
pbkdf2 = { version = "0.12", features = ["hmac"] }  # Password-based key derivation
hkdf = "0.12"                          # HKDF-SHA256 for sub-key derivation
sha2 = "0.10"                          # SHA-256 hashing
hmac = "0.12"                          # HMAC for message authentication
rand = "0.8"                           # Cryptographically secure RNG
zeroize = { version = "1.7", features = ["derive"] }  # Secure memory wiping
base64 = "0.22"                        # Base64 encoding/decoding
hex = "0.4"                            # Hex encoding/decoding
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }  # 2FA TOTP

# -----------------------------------------------------------------------------
# Database (SQLite with sqlx)
# -----------------------------------------------------------------------------
sqlx = { version = "0.7", features = [
    "runtime-tokio-native-tls",
    "sqlite",
    "chrono",
    "migrate"
] }

# -----------------------------------------------------------------------------
# Serialization
# -----------------------------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# -----------------------------------------------------------------------------
# HTTP Client (HTTPS-only, rustls with OS native roots)
# -----------------------------------------------------------------------------
reqwest = {
    version = "0.11",
    default-features = false,
    features = [
        "json",
        "rustls-tls-native-roots",     # Uses OS certificate store (corporate proxy safe)
        "cookies"
    ]
}
percent-encoding = "2.3"

# -----------------------------------------------------------------------------
# Async Runtime
# -----------------------------------------------------------------------------
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "sync",
    "signal"
] }

# -----------------------------------------------------------------------------
# Utilities & Observability
# -----------------------------------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
dotenv = "0.15"
once_cell = "1.19"
regex = "1.10"

# -----------------------------------------------------------------------------
# UI & System Integration
# -----------------------------------------------------------------------------
rfd = "0.14"                           # File dialogs
url = "2.5"

# -----------------------------------------------------------------------------
# Keyring (PINNED to prevent breaking upgrade to v4)
# -----------------------------------------------------------------------------
keyring = "=3.6.3"                     # PINNED: v4 has breaking API changes

# -----------------------------------------------------------------------------
# WebSocket (for real-time features if needed)
# -----------------------------------------------------------------------------
tokio-tungstenite = "0.21"
futures-util = "0.3"

# -----------------------------------------------------------------------------
# Platform-Specific Dependencies (for main.rs)
# -----------------------------------------------------------------------------
dirs = "5"                             # Cross-platform directory paths (data_local_dir)
ansi_term = "0.12"                     # Windows ANSI color support
ctrlc = "3.4"                          # Ctrl+C signal handler
fs2 = "0.4"                            # File locking (single instance guard)

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"                    # Unix signal handling (SIGTERM)

# =============================================================================
# FEATURES
# =============================================================================

[features]
default = ["custom-protocol", "single-instance"]
custom-protocol = ["tauri/custom-protocol"]
single-instance = []                   # Enable single instance guard (prevents DB corruption)

# =============================================================================
# RELEASE PROFILE (Production-Grade Optimization)
# =============================================================================

[profile.release]
panic = "abort"                        # Abort on panic (smaller binary, no unwinding)
codegen-units = 1                      # Single compilation unit (better optimization)
lto = "fat"                            # Full LTO (better than "true")
opt-level = "s"                        # Optimize for size (good balance)
strip = true                           # Remove debug symbols
debug = false                          # No debug info in release

# =============================================================================
# DEV PROFILE (Faster compilation for development)
# =============================================================================

[profile.dev]
opt-level = 0
debug = true
strip = false

# =============================================================================
# TEST PROFILE (Optimized for test execution)
# =============================================================================

[profile.test]
opt-level = 1
debug = true

# =============================================================================
# BENCH PROFILE (Maximum optimization for benchmarks)
# =============================================================================

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false