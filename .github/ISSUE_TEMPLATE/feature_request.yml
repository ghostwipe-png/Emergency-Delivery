name: 💡 Feature Request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe your ideal solution
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Related channel
      options: [Email, SMS, Voice, Guardian, Inheritance, Payments, General]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered