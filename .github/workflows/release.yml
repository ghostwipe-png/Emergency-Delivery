name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      # =========================================================================
      # WRITE .env FILES FROM SECRETS — BEFORE BUILD
      # build.rs reads src-tauri/.env (Rust option_env!) and Vite reads ./.env
      # (VITE_*). Missing/empty secrets are skipped so features degrade gracefully.
      # =========================================================================
      - name: Write compile-time .env files from secrets
        shell: bash
        run: |
          touch src-tauri/.env .env
          w() { [ -n "$2" ] && echo "$1=\"$2\"" >> src-tauri/.env; }
          v() { [ -n "$2" ] && echo "$1=\"$2\"" >> .env; }

          # --- Backend (Rust, baked at compile time) ---
          w PAYSTACK_SECRET_KEY     "${{ secrets.PAYSTACK_SECRET_KEY }}"
          
          w R2_ACCOUNT_ID           "${{ secrets.R2_ACCOUNT_ID }}"
          w R2_BUCKET               "${{ secrets.R2_BUCKET }}"
          w R2_ACCESS_KEY_ID        "${{ secrets.R2_ACCESS_KEY_ID }}"
          w R2_SECRET_ACCESS_KEY    "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          w DELIVERY_WORKER_URL     "${{ secrets.DELIVERY_WORKER_URL }}"
          w DELIVERY_WORKER_SECRET  "${{ secrets.DELIVERY_WORKER_SECRET }}"
          w WORKER_FILE_KEY         "${{ secrets.WORKER_FILE_KEY }}"
          w MOBITECH_API_KEY        "${{ secrets.MOBITECH_API_KEY }}"
          

          # --- Frontend (Vite) ---
          v VITE_WORKER_URL         "${{ secrets.DELIVERY_WORKER_URL }}"
          v VITE_WORKER_SECRET      "${{ secrets.DELIVERY_WORKER_SECRET }}"
          echo "✅ .env files written for compile-time injection"

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Belt-and-suspenders: also expose as process env for option_env!
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DELIVERY_WORKER_URL: ${{ secrets.DELIVERY_WORKER_URL }}
          DELIVERY_WORKER_SECRET: ${{ secrets.DELIVERY_WORKER_SECRET }}
          WORKER_FILE_KEY: ${{ secrets.WORKER_FILE_KEY }}
          MOBITECH_API_KEY: ${{ secrets.MOBITECH_API_KEY }}
          
          VITE_WORKER_URL: ${{ secrets.DELIVERY_WORKER_URL }}
          VITE_WORKER_SECRET: ${{ secrets.DELIVERY_WORKER_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Emergency Delivery v__VERSION__'
          releaseBody: 'Cross-platform release (Windows · macOS · Linux). See assets to download and install.'
          releaseDraft: false
          prerelease: false
          includeDebug: false
          updaterJsonPreferNsis: true

      # Security hygiene: remove secret files from the runner
      - name: Clean up .env files
        if: always()
        shell: bash
        run: rm -f src-tauri/.env .env